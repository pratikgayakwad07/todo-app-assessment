name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
  workflow_dispatch: 

permissions:
  id-token: write   # Required for requesting the JWT via OIDC
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: us-east-1
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }} # Set to arn:aws:iam::<account-id>:role/todo-app-github-actions-role
  ECS_CLUSTER: todo-app-dev-cluster
  FRONTEND_SERVICE: todo-app-dev-frontend-svc
  BACKEND_SERVICE: todo-app-dev-backend-svc
  FRONTEND_ECR_REPO: todo-app-dev-frontend
  BACKEND_ECR_REPO: todo-app-dev-backend

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci
          npm test

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    name: Build Docker Images, Push to ECR & Deploy to ECS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC or Secret Keys fallback)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- 1. FRONTEND BUILD & PUSH ---
      - name: Build, tag, and push Frontend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd frontend
          docker build -t $ECR_REGISTRY/$FRONTEND_ECR_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$FRONTEND_ECR_REPO:latest .
          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPO:latest

      # --- 2. BACKEND BUILD & PUSH ---
      - name: Build, tag, and push Backend image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$BACKEND_ECR_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$BACKEND_ECR_REPO:latest .
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPO:latest

      # --- 3. DEPLOY TO ECS SERVICES ---
      - name: Deploy Frontend to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $FRONTEND_SERVICE \
            --force-new-deployment

      - name: Deploy Backend to Amazon ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $BACKEND_SERVICE \
            --force-new-deployment

      # --- 4. VERIFY DEPLOYMENT ROLLOUT ---
      - name: Verify ECS Services Deployment
        run: |
          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $FRONTEND_SERVICE $BACKEND_SERVICE
          echo "Deployment successful!"

